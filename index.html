<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QE Requirement Center - GETS PRO</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

  <!-- Header -->
  <header class="bg-indigo-900 text-white shadow-md sticky top-0 z-20">
    <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
      <div>
        <h1 class="text-xl font-bold tracking-tight">Quality Requirement & Change Center</h1>
        <p class="text-xs text-indigo-200">Customer Notes, Ad-Hoc Directives & Attached Proof</p>
      </div>
      <div class="flex gap-2">
        <button onclick="exportToCSV()" class="bg-indigo-700 hover:bg-indigo-600 px-3 py-2 rounded-lg text-sm font-medium transition shadow">
          📥 Export CSV
        </button>
        <button onclick="openModal()" class="bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded-lg text-sm font-semibold transition shadow flex items-center gap-1">
          <span>+</span> Add Requirement
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-4 py-6">
    
    <!-- Filters & Search -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-6 flex flex-col md:flex-row gap-4 items-center justify-between">
      <div class="w-full md:w-1/3">
        <input type="text" id="searchInput" oninput="filterData()" placeholder="Search Part No, Customer, Keyword..." 
          class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm" />
      </div>
      <div class="flex flex-wrap gap-2 w-full md:w-auto">
        <select id="filterStatus" onchange="filterData()" class="px-3 py-2 border rounded-lg text-sm bg-white focus:outline-none">
          <option value="ALL">All Status</option>
          <option value="Active">Active</option>
          <option value="Pending">Pending / Upcoming</option>
          <option value="Temporary">Temporary Deviation</option>
          <option value="Closed">Closed / Obsolete</option>
        </select>
        <select id="filterSource" onchange="filterData()" class="px-3 py-2 border rounded-lg text-sm bg-white focus:outline-none">
          <option value="ALL">All Sources</option>
          <option value="Customer Email">Customer Email</option>
          <option value="Manager Directive">Manager Directive</option>
          <option value="Sales Instruction">Sales Instruction</option>
          <option value="President Memo">President Memo</option>
          <option value="Verbal / Meeting">Verbal / Meeting</option>
        </select>
      </div>
    </div>

    <!-- Requirements Table -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-x-auto">
      <table class="w-full text-left text-sm border-collapse">
        <thead class="bg-slate-100 text-slate-700 font-semibold border-b border-slate-200">
          <tr>
            <th class="p-3">Customer / Project</th>
            <th class="p-3">Part No / Model</th>
            <th class="p-3">Requirement / Change Detail</th>
            <th class="p-3">Attachment</th>
            <th class="p-3">Effective Date</th>
            <th class="p-3">Origin / Source</th>
            <th class="p-3">Status</th>
            <th class="p-3 text-right">Actions</th>
          </tr>
        </thead>
        <tbody id="requirementsTableBody" class="divide-y divide-slate-100">
          <tr>
            <td colspan="8" class="text-center py-8 text-slate-400">Loading records...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <!-- Add / Edit Modal -->
  <div id="recordModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl shadow-xl max-w-lg w-full p-6 relative max-h-[90vh] overflow-y-auto">
      <h2 id="modalTitle" class="text-lg font-bold text-slate-800 mb-4">Add Requirement Record</h2>
      
      <form id="reqForm" onsubmit="saveRequirement(event)" class="space-y-4 text-sm">
        <input type="hidden" id="recordId" />
        <input type="hidden" id="existingAttachmentData" />
        <input type="hidden" id="existingAttachmentType" />
        <input type="hidden" id="existingAttachmentName" />

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Customer Name</label>
            <input type="text" id="custName" class="w-full border rounded p-2 focus:ring-1 focus:ring-indigo-500" placeholder="e.g. Velocity" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Part No / Model</label>
            <input type="text" id="partNo" class="w-full border rounded p-2 focus:ring-1 focus:ring-indigo-500" placeholder="e.g. -" />
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Origin / Source</label>
            <select id="source" class="w-full border rounded p-2 focus:ring-1 focus:ring-indigo-500 bg-white">
              <option value="Customer Email">Customer Email</option>
              <option value="Manager Directive">Manager Directive</option>
              <option value="Sales Instruction">Sales Instruction</option>
              <option value="President Memo">President Memo</option>
              <option value="Verbal / Meeting">Verbal / Meeting</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Reference / Email Subject</label>
            <input type="text" id="referenceDoc" class="w-full border rounded p-2 focus:ring-1 focus:ring-indigo-500" placeholder="e.g. Email dated 12-Oct" />
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Requirement / Change Details</label>
          <textarea id="details" rows="3" class="w-full border rounded p-2 focus:ring-1 focus:ring-indigo-500" placeholder="Describe the tolerance change, visual defect limit, packing spec, etc."></textarea>
        </div>

        <!-- Attachment Box -->
        <div class="p-3 bg-slate-50 border border-slate-200 rounded-lg">
          <label class="block text-xs font-semibold text-slate-700 mb-1">Attach Image / PDF / Doc</label>
          <input type="file" id="fileAttachment" accept="image/*,.pdf,.doc,.docx" 
            class="block w-full text-xs text-slate-500 file:mr-2 file:py-1 file:px-2.5 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 cursor-pointer" />
          
          <div id="currentAttachmentInfo" class="mt-2 text-xs text-slate-600 hidden flex items-center justify-between bg-white p-2 border rounded">
            <span id="currentAttachmentName" class="font-medium text-indigo-600 truncate max-w-[200px]"></span>
            <button type="button" onclick="removeCurrentAttachment()" class="text-rose-600 font-semibold hover:underline">
              🗑️ Delete Attachment
            </button>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Effective Date</label>
            <input type="date" id="effectiveDate" class="w-full border rounded p-2 focus:ring-1 focus:ring-indigo-500" />
            <span class="text-[10px] text-slate-400">Defaults to today if blank</span>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Status</label>
            <select id="status" class="w-full border rounded p-2 focus:ring-1 focus:ring-indigo-500 bg-white">
              <option value="Active">Active (Ongoing)</option>
              <option value="Pending">Pending (Future Date)</option>
              <option value="Temporary">Temporary Deviation</option>
              <option value="Closed">Closed / Superseded</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Station / Affected Process</label>
          <input type="text" id="stations" class="w-full border rounded p-2 focus:ring-1 focus:ring-indigo-500" placeholder="e.g. Line 2 SMT, Final QA, Packaging" />
        </div>

        <div class="flex justify-end gap-2 pt-4 border-t">
          <button type="button" onclick="closeModal()" class="px-4 py-2 border rounded-lg hover:bg-slate-100">Cancel</button>
          <button type="submit" id="saveBtn" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg shadow">Save Record</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Fullscreen Image Viewer Modal -->
  <div id="imageViewerModal" class="fixed inset-0 bg-black/80 hidden flex items-center justify-center p-4 z-50" onclick="closeImageViewer()">
    <div class="max-w-4xl max-h-[90vh] bg-white p-2 rounded-xl shadow-2xl relative" onclick="event.stopPropagation()">
      <button onclick="closeImageViewer()" class="absolute -top-3 -right-3 bg-white text-slate-800 rounded-full w-8 h-8 font-bold shadow hover:bg-slate-100">✕</button>
      <img id="fullImagePreview" src="" alt="Full Preview" class="max-h-[85vh] max-w-full rounded-lg object-contain" />
    </div>
  </div>

  <!-- FIREBASE SCRIPTS -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      updateDoc, 
      deleteDoc, 
      doc, 
      onSnapshot, 
      query, 
      orderBy 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAt4zHjnll8FC_Dckm1dZSt2G7m27Ii3VQ",
      authDomain: "gets-pro.firebaseapp.com",
      projectId: "gets-pro",
      storageBucket: "gets-pro.firebasestorage.app",
      messagingSenderId: "733073834741",
      appId: "1:733073834741:web:50c6f53e1b46e7c6767bbc",
      measurementId: "G-Z9WJ57TJRS"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const reqCollection = collection(db, "customer_requirements");

    let localRecords = [];

    // Real-Time Listener
    const q = query(reqCollection, orderBy("effectiveDate", "desc"));
    onSnapshot(q, (snapshot) => {
      localRecords = [];
      snapshot.forEach((docSnapshot) => {
        localRecords.push({ id: docSnapshot.id, ...docSnapshot.data() });
      });
      renderTable(localRecords);
    }, (error) => {
      console.error("Firestore Error: ", error);
      document.getElementById("requirementsTableBody").innerHTML = `
        <tr><td colspan="8" class="text-center py-6 text-red-500 font-medium">Error: ${error.message}</td></tr>
      `;
    });

    // Render Table with Instant Thumbnail & Delete Attachment Button
    function renderTable(data) {
      const tbody = document.getElementById("requirementsTableBody");
      tbody.innerHTML = "";

      if (data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="8" class="text-center py-6 text-slate-400">No records found. Click "+ Add Requirement" to create one.</td></tr>`;
        return;
      }

      data.forEach((item) => {
        const badgeColors = {
          "Active": "bg-emerald-100 text-emerald-800",
          "Pending": "bg-amber-100 text-amber-800",
          "Temporary": "bg-purple-100 text-purple-800",
          "Closed": "bg-slate-100 text-slate-600"
        };
        const statusBadge = badgeColors[item.status] || "bg-slate-100 text-slate-800";

        // Display Attachment preview & Remove Button
        let attachmentHtml = `<span class="text-xs text-slate-300">-</span>`;
        if (item.attachment && item.attachment.data) {
          const isImage = item.attachment.type && item.attachment.type.startsWith("image/");
          const isPdf = item.attachment.type && item.attachment.type.includes("pdf");

          let fileBtn = '';
          if (isImage) {
            fileBtn = `
              <img src="${item.attachment.data}" alt="thumbnail" 
                onclick="viewImage('${item.attachment.data}')"
                class="h-10 w-10 object-cover rounded border border-slate-200 cursor-pointer hover:scale-105 transition shadow-sm" 
                title="Click to zoom in" />
            `;
          } else if (isPdf) {
            fileBtn = `
              <a href="${item.attachment.data}" download="${item.attachment.name || 'doc.pdf'}" 
                class="inline-flex items-center gap-1 text-[11px] font-semibold text-rose-700 bg-rose-50 border border-rose-200 hover:bg-rose-100 px-2 py-1 rounded">
                📄 PDF
              </a>
            `;
          } else {
            fileBtn = `
              <a href="${item.attachment.data}" download="${item.attachment.name || 'doc'}" 
                class="inline-flex items-center gap-1 text-[11px] font-semibold text-blue-700 bg-blue-50 border border-blue-200 hover:bg-blue-100 px-2 py-1 rounded">
                📎 Doc
              </a>
            `;
          }

          attachmentHtml = `
            <div class="flex flex-col items-start gap-1">
              ${fileBtn}
              <button onclick="deleteAttachmentOnly('${item.id}')" 
                class="text-[10px] text-rose-600 hover:text-rose-800 hover:underline font-semibold" 
                title="Remove attachment from this line">
                🗑️ Remove
              </button>
            </div>
          `;
        }

        const tr = document.createElement("tr");
        tr.className = "hover:bg-slate-50 transition border-b border-slate-100";
        tr.innerHTML = `
          <td class="p-3 font-semibold text-slate-900">${escapeHtml(item.customer || "-")}</td>
          <td class="p-3 font-mono text-xs text-indigo-700 bg-indigo-50/50 rounded inline-block my-2">${escapeHtml(item.partNo || "-")}</td>
          <td class="p-3 max-w-sm">
            <div class="font-medium text-slate-800 whitespace-pre-wrap">${escapeHtml(item.details || "-")}</div>
            ${item.stations ? `<span class="text-xs text-slate-400 block mt-1">📍 Station: ${escapeHtml(item.stations)}</span>` : ""}
          </td>
          <td class="p-3 whitespace-nowrap">${attachmentHtml}</td>
          <td class="p-3 font-mono text-slate-600 whitespace-nowrap">${escapeHtml(item.effectiveDate || "-")}</td>
          <td class="p-3">
            <span class="text-xs font-medium text-slate-700 block">${escapeHtml(item.source)}</span>
            <span class="text-[11px] text-slate-400 block">${escapeHtml(item.referenceDoc || "-")}</span>
          </td>
          <td class="p-3">
            <span class="px-2 py-0.5 text-xs font-semibold rounded-full ${statusBadge}">${escapeHtml(item.status)}</span>
          </td>
          <td class="p-3 text-right space-x-1 whitespace-nowrap">
            <button onclick="editRecord('${item.id}')" class="text-indigo-600 hover:text-indigo-900 text-xs font-semibold px-2 py-1">Edit</button>
            <button onclick="deleteRecord('${item.id}')" class="text-rose-600 hover:text-rose-900 text-xs font-semibold px-2 py-1">Delete</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // Ultra-Fast File Processing (Max 800px, 0.55 quality, finishes in ~0.1s)
    function fastProcessFile(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();

        if (file.type.startsWith("image/")) {
          reader.readAsDataURL(file);
          reader.onload = (e) => {
            const img = new Image();
            img.src = e.target.result;
            img.onload = () => {
              const canvas = document.createElement("canvas");
              const maxDim = 800; // Fast resize: produces tiny ~40KB image
              let w = img.width;
              let h = img.height;

              if (w > maxDim || h > maxDim) {
                if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
                else { w = Math.round((w * maxDim) / h); h = maxDim; }
              }

              canvas.width = w;
              canvas.height = h;
              const ctx = canvas.getContext("2d");
              ctx.drawImage(img, 0, 0, w, h);

              // 0.55 JPEG quality creates very lightweight and crisp preview
              const fastDataUrl = canvas.toDataURL("image/jpeg", 0.55);
              resolve({
                name: file.name,
                type: "image/jpeg",
                data: fastDataUrl
              });
            };
            img.onerror = () => reject(new Error("Unable to read image."));
          };
          reader.onerror = () => reject(new Error("Failed to load file."));
        } else {
          // PDF or Docs limit to 600KB to guarantee instant saving
          if (file.size > 600 * 1024) {
            return reject(new Error("PDF / Document is too large! Please choose a document under 600KB."));
          }
          reader.readAsDataURL(file);
          reader.onload = () => {
            resolve({
              name: file.name,
              type: file.type || "application/octet-stream",
              data: reader.result
            });
          };
          reader.onerror = () => reject(new Error("Failed to load document."));
        }
      });
    }

    // Save Record (Instant)
    window.saveRequirement = async function(e) {
      e.preventDefault();
      const btn = document.getElementById("saveBtn");
      btn.disabled = true;
      btn.innerText = "Saving (Fast)...";

      const id = document.getElementById("recordId").value;
      const fileInput = document.getElementById("fileAttachment");
      const effectiveDateInput = document.getElementById("effectiveDate").value;
      const today = new Date().toISOString().slice(0, 10);

      let attachment = null;
      const existingData = document.getElementById("existingAttachmentData").value;
      if (existingData) {
        attachment = {
          data: existingData,
          name: document.getElementById("existingAttachmentName").value,
          type: document.getElementById("existingAttachmentType").value
        };
      }

      try {
        if (fileInput.files.length > 0) {
          attachment = await fastProcessFile(fileInput.files[0]);
        }

        const record = {
          customer: document.getElementById("custName").value.trim() || "General Customer",
          partNo: document.getElementById("partNo").value.trim() || "-",
          source: document.getElementById("source").value || "Customer Email",
          referenceDoc: document.getElementById("referenceDoc").value.trim() || "",
          details: document.getElementById("details").value.trim() || "-",
          effectiveDate: effectiveDateInput || today,
          status: document.getElementById("status").value || "Active",
          stations: document.getElementById("stations").value.trim() || "",
          attachment: attachment,
          updatedAt: new Date().toISOString()
        };

        if (id) {
          await updateDoc(doc(db, "customer_requirements", id), record);
        } else {
          record.createdAt = new Date().toISOString();
          await addDoc(reqCollection, record);
        }

        window.closeModal();
      } catch (err) {
        console.error("Save error:", err);
        alert(err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = "Save Record";
      }
    };

    // DIRECT BUTTON: Delete Attachment Only from Table
    window.deleteAttachmentOnly = async function(id) {
      if (confirm("Delete the attachment from this requirement?")) {
        try {
          await updateDoc(doc(db, "customer_requirements", id), {
            attachment: null,
            updatedAt: new Date().toISOString()
          });
        } catch (err) {
          alert("Failed to delete attachment: " + err.message);
        }
      }
    };

    window.editRecord = function(id) {
      const item = localRecords.find((r) => r.id === id);
      if (!item) return;

      document.getElementById("recordId").value = item.id;
      document.getElementById("custName").value = item.customer || "";
      document.getElementById("partNo").value = item.partNo || "";
      document.getElementById("source").value = item.source || "Customer Email";
      document.getElementById("referenceDoc").value = item.referenceDoc || "";
      document.getElementById("details").value = item.details || "";
      document.getElementById("effectiveDate").value = item.effectiveDate || "";
      document.getElementById("status").value = item.status || "Active";
      document.getElementById("stations").value = item.stations || "";

      if (item.attachment && item.attachment.data) {
        document.getElementById("existingAttachmentData").value = item.attachment.data;
        document.getElementById("existingAttachmentName").value = item.attachment.name || "Attached File";
        document.getElementById("existingAttachmentType").value = item.attachment.type || "";
        document.getElementById("currentAttachmentName").innerText = item.attachment.name || "Attached File";
        document.getElementById("currentAttachmentInfo").classList.remove("hidden");
      } else {
        window.removeCurrentAttachment();
      }

      document.getElementById("modalTitle").innerText = "Edit Requirement Record";
      window.openModal();
    };

    // Remove Attachment inside Modal
    window.removeCurrentAttachment = function() {
      document.getElementById("existingAttachmentData").value = "";
      document.getElementById("existingAttachmentName").value = "";
      document.getElementById("existingAttachmentType").value = "";
      document.getElementById("fileAttachment").value = "";
      document.getElementById("currentAttachmentInfo").classList.add("hidden");
    };

    window.deleteRecord = async function(id) {
      if (confirm("Are you sure you want to delete this requirement record?")) {
        try {
          await deleteDoc(doc(db, "customer_requirements", id));
        } catch (err) {
          alert("Error deleting record: " + err.message);
        }
      }
    };

    window.viewImage = function(src) {
      document.getElementById("fullImagePreview").src = src;
      document.getElementById("imageViewerModal").classList.remove("hidden");
    };

    window.closeImageViewer = function() {
      document.getElementById("imageViewerModal").classList.add("hidden");
      document.getElementById("fullImagePreview").src = "";
    };

    window.filterData = function() {
      const queryText = document.getElementById("searchInput").value.toLowerCase();
      const status = document.getElementById("filterStatus").value;
      const source = document.getElementById("filterSource").value;

      const filtered = localRecords.filter((r) => {
        const matchesQuery = 
          (r.customer && r.customer.toLowerCase().includes(queryText)) ||
          (r.partNo && r.partNo.toLowerCase().includes(queryText)) ||
          (r.details && r.details.toLowerCase().includes(queryText)) ||
          (r.stations && r.stations.toLowerCase().includes(queryText));

        const matchesStatus = (status === "ALL" || r.status === status);
        const matchesSource = (source === "ALL" || r.source === source);

        return matchesQuery && matchesStatus && matchesSource;
      });

      renderTable(filtered);
    };

    window.exportToCSV = function() {
      if (!localRecords.length) return alert("No records available to export.");
      let csv = "Customer,Part Number,Details,Effective Date,Source,Reference,Status,Stations\n";
      localRecords.forEach((r) => {
        csv += `"${r.customer || ''}","${r.partNo || ''}","${(r.details || '').replace(/"/g, '""')}","${r.effectiveDate || ''}","${r.source || ''}","${r.referenceDoc || ''}","${r.status || ''}","${r.stations || ''}"\n`;
      });
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `Quality_Requirements_${new Date().toISOString().slice(0, 10)}.csv`;
      link.click();
    };

    window.openModal = function() {
      document.getElementById("recordModal").classList.remove("hidden");
    };

    window.closeModal = function() {
      document.getElementById("reqForm").reset();
      document.getElementById("recordId").value = "";
      window.removeCurrentAttachment();
      document.getElementById("modalTitle").innerText = "Add Requirement Record";
      document.getElementById("recordModal").classList.add("hidden");
    };

    function escapeHtml(str) {
      return (str || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
  </script>
</body>
</html>
